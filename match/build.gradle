plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.maven.publish)
    id 'signing'
}

android {
    namespace 'com.lcg.match'
    compileSdk {
        version = release(30)
    }

    defaultConfig {
        minSdk 23
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    api 'net.java.dev.jna:jna:5.19.1@aar'
}

publishing {
    // Keep the local repository for offline consumers and bundle inspection.
    repositories { RepositoryHandler handler ->
        handler.maven {
            url "${rootDir}/repo"
        }
    }

    publications { PublicationContainer publication ->
        maven(MavenPublication) {
            afterEvaluate { from components.release }
            groupId = "io.github.ddoolcg"
            artifactId = "match"
            version = "1.0"

            pom {
                name = "match"
                description = "Android voice matching library with native speech recognition."
                url = "https://github.com/ddoolcg/Speech"
                licenses {
                    license {
                        name = "The Apache Software License, Version 2.0"
                        url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                        distribution = "repo"
                    }
                }
                developers {
                    developer {
                        id = "ddoolcg"
                        name = "Lei Chuguang"
                        email = "475825657@qq.com"
                    }
                }
                scm {
                    connection = "scm:git:https://github.com/ddoolcg/Speech.git"
                    developerConnection = "scm:git:ssh://git@github.com/ddoolcg/Speech.git"
                    url = "https://github.com/ddoolcg/Speech"
                }
            }
        }
    }
}

signing {
    def secretKeyFile = providers.gradleProperty('signing.secretKeyFile')
            .map { file(it) }
            .orElse(file("${System.getProperty('user.home')}/.gnupg-maven/maven-secret-key.asc"))
    if (secretKeyFile.get().isFile()) {
        useInMemoryPgpKeys(secretKeyFile.get().getText('UTF-8'), '')
    }
    sign publishing.publications.maven
}
