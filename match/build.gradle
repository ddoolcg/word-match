import com.vanniktech.maven.publish.AndroidSingleVariantLibrary

plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.maven.publish)
}

android {
    namespace 'com.lcg.match'
    compileSdk {
        version = release(30)
    }

    defaultConfig {
        minSdk 23
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    api 'net.java.dev.jna:jna:5.19.1@aar'
}

mavenPublishing {
    // The plugin reads these properties lazily through providers.gradleProperty:
    // mavenCentralUsername and mavenCentralPassword.
    publishToMavenCentral()
    signAllPublications()

    configure(new AndroidSingleVariantLibrary('release', true, true))
    coordinates('io.github.ddoolcg', 'match', '1.2')

    pom {
        name = 'match'
        description = '英语单词语音匹配库'
        url = 'https://github.com/ddoolcg/word-match'
        licenses {
            license {
                name = 'The Apache Software License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'ddoolcg'
                name = '雷楚光'
                email = '475825657@qq.com'
            }
        }
        scm {
            connection = 'scm:git:https://github.com/ddoolcg/word-match.git'
            developerConnection = 'scm:git:ssh://git@github.com/ddoolcg/word-match.git'
            url = 'https://github.com/ddoolcg/word-match'
        }
    }
}

// Reuse the existing exported key file when signingInMemoryKey is not set.
// This keeps the private key out of gradle.properties while providing the
// same signing configuration expected by the Maven Central plugin.
def signingSecretKeyFile = providers.gradleProperty('signing.secretKeyFile')
        .map { file(it) }
def signingKeyPassword = providers.gradleProperty('signingInMemoryKeyPassword').orElse('')

if (signingSecretKeyFile.isPresent() && signingSecretKeyFile.get().isFile()) {
    signing {
        useInMemoryPgpKeys(
                signingSecretKeyFile.get().getText('UTF-8'),
                signingKeyPassword.get()
        )
    }
}
